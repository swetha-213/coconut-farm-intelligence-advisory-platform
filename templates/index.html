<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coconut Farm DSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 80, 0, 0.65)),
                        url('https://images.unsplash.com/photo-1501696461415-6bd6660c6742?auto=format&fit=crop&q=80') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(34, 139, 34, 0.25), rgba(0, 100, 0, 0.4));
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
        }
        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            text-shadow: 3px 3px 12px rgba(0,0,0,0.7);
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            color: #fffef0;
        }
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            font-weight: 300;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
        }
        .btn-custom {
            font-size: 1.4rem;
            padding: 0.9rem 2.5rem;
            border-radius: 50px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin: 0.8rem;
        }
        .btn-login {
            background: linear-gradient(135deg, #2c6e49, #4a9d5d);
            border: none;
        }
        .btn-register {
            background: linear-gradient(135deg, #f4a261, #e76f51);
            border: none;
        }
        .btn-custom:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .icon-leaf {
            font-size: 3.5rem;
            color: #90ee90;
            margin-bottom: 1.5rem;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @media (max-width: 768px) {
            h1 { font-size: 3.2rem; }
            .subtitle { font-size: 1.3rem; }
            .btn-custom { font-size: 1.2rem; padding: 0.8rem 2rem; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="content">
        <i class="fas fa-leaf icon-leaf"></i>
        
        <h1>Coconut Farm Intelligence & Advisory Platform

</h1>
        
        <p class="subtitle">
            Empowering coconut farmers with smart insights, weather alerts, disease detection & yield optimization
        </p>
        
        <div>
            <a href="/login" class="btn btn-lg btn-custom btn-login text-white">
                <i class="fas fa-sign-in-alt me-2"></i> Login
            </a>
            <a href="/register" class="btn btn-lg btn-custom btn-register text-white">
                <i class="fas fa-user-plus me-2"></i> Register
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
