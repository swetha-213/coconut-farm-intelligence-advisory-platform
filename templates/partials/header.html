<header class="header d-flex justify-content-between align-items-center position-relative mb-5 px-4 py-3" style="background: rgba(44, 110, 73, 0.9); backdrop-filter: blur(10px); border-bottom: 2px solid rgba(255,255,255,0.2);">
    <div class="d-flex align-items-center">
        <h3 class="mb-0 text-white fw-bold">
            {{ username }} - Coconut Farm
        </h3>
    </div>
    
    <!-- Logout button - RIGHT CORNER -->
    <form action="/logout" method="POST" class="d-inline ms-auto">
        <button type="submit" class="btn logout-btn text-white px-4 py-2">
            <i class="fas fa-sign-out-alt me-2"></i> Logout
        </button>
    </form>
    
    <i class="fas fa-leaf icon-leaf" style="position: absolute; top: 20px; right: 30px; font-size: 3rem; color: #90ee90; opacity: 0.7;"></i>
</header>

<style>
    .logout-btn {
        background: linear-gradient(135deg, #e63946, #d00000);
        border: none;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s;
        min-width: 140px;
    }
    .logout-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(214, 40, 40, 0.5);
    }
</style>
